<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Un detalle para ti 🌼</title>
  <style>
    :root {
      --bg-color: #faf7f2;
      --card-bg: #ffffff;
      --text-color: #333333;
      --accent-yellow: #fcd34d;
      --accent-orange: #fbbf24;
      --stem-green: #4ade80;
      --trunk-brown: #78350f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 30px 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Animación del Árbol de Flores */
    .tree-canvas {
      position: relative;
      width: 280px;
      height: 260px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .trunk {
      position: absolute;
      bottom: 0;
      width: 16px;
      height: 0px;
      background: var(--trunk-brown);
      border-radius: 8px 8px 0 0;
      animation: growTrunk 1.5s ease-out forwards;
    }

    @keyframes growTrunk {
      to {
        height: 110px;
      }
    }

    /* Copa del árbol / Flores amarillas */
    .foliage {
      position: absolute;
      bottom: 90px;
      width: 220px;
      height: 160px;
      opacity: 0;
      transform: scale(0.3);
      animation: bloomFoliage 1.2s 1.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    @keyframes bloomFoliage {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .flower-cluster {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .mini-flower {
      position: absolute;
      width: 16px;
      height: 16px;
      background: var(--accent-yellow);
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(251, 191, 36, 0.6);
    }

    .mini-flower::after {
      content: '';
      position: absolute;
      top: 4px;
      left: 4px;
      width: 8px;
      height: 8px;
      background: var(--accent-orange);
      border-radius: 50%;
    }

    /* Mensaje y tipografía */
    .title {
      font-size: 1.3rem;
      font-weight: 600;
      color: #27272a;
      opacity: 0;
      animation: fadeIn 1s 2.2s forwards;
    }

    .message {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #52525b;
      min-height: 70px;
    }

    /* Contador ligero / fecha de inicio */
    .counter {
      font-size: 0.85rem;
      color: #a1a1aa;
      font-weight: 500;
      padding-top: 10px;
      border-top: 1px solid #f4f4f5;
      width: 100%;
      opacity: 0;
      animation: fadeIn 1s 3s forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="tree-canvas">
      <div class="trunk"></div>
      <div class="foliage" id="foliage"></div>
    </div>

    <h1 class="title">Un detalle para ti 🌼</h1>
    <p class="message" id="typewriterText"></p>
    <div class="counter" id="timer">Nos conocemos desde hace poco, ¡pero quería darte este detalle!</div>
  </div>

  <script>
    // Generación dinámica de flores en copa en forma de copa suave
    const foliage = document.getElementById('foliage');
    const totalFlowers = 45;

    for (let i = 0; i < totalFlowers; i++) {
      const flower = document.createElement('div');
      flower.className = 'mini-flower';

      // Posicionamiento en patrón aleatorio esférico/ovalado
      const angle = Math.random() * Math.PI * 2;
      const radius = Math.random() * 75;
      const x = Math.cos(angle) * radius + 100;
      const y = Math.sin(angle) * (radius * 0.7) + 60;

      flower.style.left = `${x}px`;
      flower.style.top = `${y}px`;
      flower.style.transform = `scale(${0.6 + Math.random() * 0.6})`;

      foliage.appendChild(flower);
    }

    // EFECTO MÁQUINA DE ESCRIBIR PARA EL MENSAJE
    const textToType = "Dicen que regalar flores amarillas transmite buena vibra y energía. Pensé que un detalle digital diferente y que no se marchitara te sacaría una sonrisa hoy.";
    const messageElement = document.getElementById('typewriterText');
    let index = 0;

    function typeWriter() {
      if (index < textToType.length) {
        messageElement.innerHTML += textToType.charAt(index);
        index++;
        setTimeout(typeWriter, 35);
      }
    }

    // Iniciar el texto automáticamente después de que florezca el árbol
    setTimeout(typeWriter, 2200);
  </script>
</body>
</html>
